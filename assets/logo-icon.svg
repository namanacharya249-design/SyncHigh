<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="SyncHigh Media logo icon">
  <defs>
    <linearGradient id="arcGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a4d9e"/>
      <stop offset="55%" stop-color="#1288c8"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="peakL" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0b5fae"/>
      <stop offset="100%" stop-color="#1d9bd8"/>
    </linearGradient>
    <linearGradient id="peakR" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0e9bb5"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
  </defs>
  <!-- top-left arc segment -->
  <path d="M 42.0 92.7 A 82 82 0 0 1 86.6 43.1" fill="none" stroke="#79aedd" stroke-width="25"/>
  <!-- right arc with downward arrowhead -->
  <path d="M 137.1 37.8 A 82 82 0 0 1 184.6 168.5" fill="none" stroke="url(#arcGrad)" stroke-width="25"/>
  <polygon points="164.9,193.7 205.2,179.6 169.0,151.2" fill="#12a5b4"/>
  <!-- bottom arc with upward arrowhead -->
  <path d="M 163.5 187.5 A 82 82 0 0 1 39.2 132.3" fill="none" stroke="url(#arcGrad)" stroke-width="25"/>
  <polygon points="33.3,98.8 63.8,134.0 16.6,142.4" fill="#0e74bc"/>
  <!-- center peak -->
  <polygon points="120,62 84,140 103,140 120,103" fill="url(#peakL)"/>
  <polygon points="120,62 120,103 137,140 156,140" fill="url(#peakR)"/>
</svg>
